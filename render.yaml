# Render Blueprint -- one web service + a managed PostgreSQL database.
# Connect this repo to Render and choose "Blueprint" so it reads this file.

databases:
  - name: elyonis-db
    plan: free            # free Postgres (expires after 90 days; switch to a
                          # paid plan for production). Region must match the web service.
    region: frankfurt

services:
  - type: web
    name: elyonis-license
    runtime: node
    plan: starter          # $7/mo, no spin-down. Free plan spins down after 15min.
    region: frankfurt      # closest to FR users; switch if your audience is elsewhere
    branch: main
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Connection string for the managed Postgres above -- injected by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: elyonis-db
          property: connectionString
      # Render exposes the listening port via the PORT env var (random).
      - key: PORT
        sync: false        # Render injects automatically
      # Secrets: set the actual values in the Render dashboard ("Environment"
      # tab) so they don't end up in git.
      - key: HMAC_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
